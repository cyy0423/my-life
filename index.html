<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f2f7"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>我的生活</title><style>
:root{--bg:#f2f2f7;--card:#fff;--text:#111;--muted:#6e6e73;--line:#e5e5ea;--accent:#007aff;--green:#34c759}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial;color:var(--text)}button,input,select{font:inherit}.app{max-width:760px;margin:auto;padding:18px 16px 92px}.top{display:flex;justify-content:space-between;align-items:center}.muted{color:var(--muted)}h1{margin:2px 0 18px;font-size:30px}.plus{width:44px;height:44px;border:0;border-radius:50%;font-size:28px;background:#eaf3ff;color:var(--accent)}.card,.list,.form{background:var(--card);border-radius:22px}.card{padding:18px;margin-bottom:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.big{font-size:38px;font-weight:750;margin:8px 0 18px}.label{font-size:13px;color:var(--muted)}.value{font-size:20px;font-weight:650;margin-top:4px}.section{font-weight:700;font-size:18px;margin:22px 2px 10px}.row{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}.page{display:none}.page.active{display:block}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(248,248,248,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line)}.nav button{border:0;background:transparent;padding:11px;border-radius:12px;color:var(--muted)}.nav .active{background:#eaf3ff;color:var(--accent);font-weight:650}.seg{display:flex;gap:8px;margin-bottom:12px}.seg button{border:1px solid var(--line);background:white;padding:9px 14px;border-radius:999px}.seg .active{background:#eaf3ff;color:var(--accent);border-color:transparent}.stats{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center}.pie{width:180px;height:180px;border-radius:50%;position:relative}.pie:after{content:"";position:absolute;inset:42px;border-radius:50%;background:white}.legend div{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin:8px 0;font-size:14px}.dot{width:10px;height:10px;border-radius:50%}.barbg{height:8px;background:#ececf1;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--accent)}.trend{margin:11px 0}.trendhead{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.week{font-size:12px;color:var(--muted);margin:10px 0}.day{border:0;background:transparent;min-height:44px;border-radius:12px;position:relative}.day.sel{background:#eaf3ff;color:var(--accent);font-weight:650}.day.task:after{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);position:absolute;bottom:4px;left:50%;transform:translateX(-50%)}.form{padding:16px}.field{margin-bottom:12px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px}.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:650}.taskrow{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.taskrow:last-child{border-bottom:0}.taskrow input{width:20px;height:20px}.done{text-decoration:line-through;color:var(--muted)}dialog{border:0;border-radius:24px;padding:0;width:min(560px,calc(100% - 28px))}dialog::backdrop{background:rgba(0,0,0,.25)}.dialog{padding:18px}@media(max-width:560px){.stats{grid-template-columns:1fr;justify-items:center}.legend{width:100%}}
</style></head><body><div class="app"><div class="top"><div><div class="muted" id="monthLabel"></div><h1>我的生活</h1></div><button class="plus" id="openEntry">＋</button></div>
<section id="home" class="page active"><div class="card"><div class="label">本月结余</div><div class="big" id="balance">¥0</div><div class="grid2"><div><div class="label">收入</div><div class="value" id="income">¥0</div></div><div><div class="label">支出</div><div class="value" id="expense">¥0</div></div></div></div><div class="grid2"><button class="card" id="goStats" style="border:0;text-align:left"><div class="label">本月花得最多</div><div class="value" id="topCat">暂无</div><div class="sub" id="topCatSub">还没有支出</div></button><button class="card" id="goMemo" style="border:0;text-align:left"><div class="label">近期事项</div><div class="value" id="taskCount">0 件</div><div class="sub" id="nextTask">暂无待办</div></button></div><div class="section">最近账目</div><div class="list" id="recent"></div></section>
<section id="stats" class="page"><div class="seg"><button class="active" data-mode="month">月度</button><button data-mode="year">年度</button></div><div class="card"><div class="label" id="statLabel">本月支出</div><div class="value" id="statTotal">¥0</div><div class="stats" style="margin-top:16px"><div class="pie" id="pie"></div><div class="legend" id="legend"></div></div></div><div class="card" id="trendCard" style="display:none"><div class="label">年度月度支出趋势</div><div class="value" id="yearTotal">¥0</div><div id="trend"></div></div></section>
<section id="calendar" class="page"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><button id="prev" class="day">‹</button><strong id="calTitle"></strong><button id="next" class="day">›</button></div><div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="cal" id="cal"></div></div><div class="card"><div class="label" id="selectedLabel"></div><div id="selectedTasks" style="margin:8px 0"></div><button class="btn" id="addFromCal">添加事项</button></div></section>
<section id="memo" class="page"><div class="form"><div class="field"><label>事项</label><input id="taskText" placeholder="例如：交房租"></div><div class="field"><label>日期</label><input id="taskDate" type="date"></div><button class="btn" id="addTask">添加到备忘录</button></div><div class="list" id="tasks" style="margin-top:12px"></div></section></div>
<nav class="nav"><button class="active" data-page="home">首页</button><button data-page="stats">统计</button><button data-page="calendar">日历</button><button data-page="memo">备忘</button></nav>
<dialog id="entryDialog"><div class="dialog"><div class="section" style="margin-top:0">添加账目</div><div class="field"><label>类型</label><select id="entryType"><option value="expense">支出</option><option value="income">收入</option><option value="transfer">内部转账</option><option value="refund">退款</option></select></div><div class="field"><label>名称 / 商家</label><input id="entryName" placeholder="例如：Olive Young"></div><div class="grid2"><div class="field"><label>原币金额</label><input id="entryAmount" type="number" min="0.01" step="0.01"></div><div class="field"><label>币种</label><select id="entryCurrency"><option value="CNY">人民币</option><option value="KRW">韩元</option><option value="JPY">日元</option></select></div></div><div class="field"><label>折算人民币金额</label><input id="entryCny" type="number" min="0.01" step="0.01"></div><div class="field"><label>分类</label><select id="entryCategory"><option>餐饮</option><option>购物</option><option>交通</option><option>住房</option><option>娱乐</option><option>学习</option><option>旅行</option><option>医疗</option><option>其他</option></select></div><div class="field"><label>日期</label><input id="entryDate" type="date"></div><div style="display:flex;gap:8px"><button class="btn" id="saveEntry">保存</button><button class="btn" id="closeEntry" style="background:#ececf1;color:#111">取消</button></div></div></dialog>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],now=new Date(),pad=n=>String(n).padStart(2,'0'),today=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let entries=get('entries',[]),tasks=get('tasks',[]),mode='month',cy=now.getFullYear(),cm=now.getMonth(),selected=today;const colors=['#5856d6','#ff9500','#34c759','#007aff','#af52de','#ff2d55','#30b0c7','#8e8e93'];$('#monthLabel').textContent=`${now.getFullYear()}年${now.getMonth()+1}月`;$('#entryDate').value=today;$('#taskDate').value=today;const money=n=>'¥'+Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:2}),save=()=>{set('entries',entries);set('tasks',tasks)},ym=d=>d.slice(0,7),curym=()=>`${now.getFullYear()}-${pad(now.getMonth()+1)}`;function expense(list){return list.reduce((s,e)=>s+(e.type==='expense'?e.cny:e.type==='refund'?-e.cny:0),0)}function income(list){return list.filter(e=>e.type==='income').reduce((s,e)=>s+e.cny,0)}function cats(list){const m={};list.forEach(e=>{const v=e.type==='expense'?e.cny:e.type==='refund'?-e.cny:0;if(v)m[e.category]=(m[e.category]||0)+v});return Object.entries(m).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1])}function renderHome(){const list=entries.filter(e=>ym(e.date)===curym()&&e.type!=='transfer'),inc=income(list),exp=expense(list),c=cats(list);$('#income').textContent=money(inc);$('#expense').textContent=money(exp);$('#balance').textContent=money(inc-exp);$('#topCat').textContent=c[0]?.[0]||'暂无';$('#topCatSub').textContent=c[0]?`${money(c[0][1])} · ${Math.round(c[0][1]/exp*100)}%`:'还没有支出';const open=tasks.filter(t=>!t.done).sort((a,b)=>a.date.localeCompare(b.date));$('#taskCount').textContent=`${open.length} 件`;$('#nextTask').textContent=open[0]?`${open[0].date} · ${open[0].text}`:'暂无待办';const box=$('#recent');box.innerHTML='';[...entries].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,8).forEach(e=>{const r=document.createElement('div');r.className='row';const sign=e.type==='income'||e.type==='refund'?'+':e.type==='transfer'?'↔':'-';r.innerHTML='<div><strong></strong><div class="sub"></div></div><div></div>';r.children[0].children[0].textContent=e.name;r.children[0].children[1].textContent=`${e.category} · ${e.date} · ${e.amount} ${e.currency}`;r.children[1].textContent=e.type==='transfer'?'内部转账':`${sign} ${money(e.cny)}`;box.appendChild(r)});if(!box.children.length)box.innerHTML='<div class="row muted">还没有账目</div>'}function renderStats(){const year=now.getFullYear(),list=mode==='month'?entries.filter(e=>ym(e.date)===curym()):entries.filter(e=>e.date.startsWith(String(year))),exp=expense(list),c=cats(list),total=c.reduce((s,x)=>s+x[1],0);$('#statLabel').textContent=mode==='month'?'本月支出':`${year}年支出`;$('#statTotal').textContent=money(exp);let acc=0,stops=[];c.forEach((x,i)=>{const p=total?x[1]/total*100:0;stops.push(`${colors[i%colors.length]} ${acc}% ${acc+p}%`);acc+=p});$('#pie').style.background=stops.length?`conic-gradient(${stops.join(',')})`:'#e5e5ea';const lg=$('#legend');lg.innerHTML='';c.forEach((x,i)=>{const d=document.createElement('div');d.innerHTML='<span class="dot"></span><span></span><strong></strong>';d.children[0].style.background=colors[i%colors.length];d.children[1].textContent=x[0];d.children[2].textContent=`${money(x[1])} · ${Math.round(x[1]/total*100)}%`;lg.appendChild(d)});if(!c.length)lg.innerHTML='<div class="muted">还没有支出数据</div>';$('#trendCard').style.display=mode==='year'?'block':'none';if(mode==='year'){const ms=[];for(let m=1;m<=12;m++){const pre=`${year}-${pad(m)}`;ms.push([`${m}月`,expense(entries.filter(e=>ym(e.date)===pre))])}const max=Math.max(1,...ms.map(x=>x[1]));$('#yearTotal').textContent=`全年 ${money(exp)}`;const t=$('#trend');t.innerHTML='';ms.forEach(x=>{const d=document.createElement('div');d.className='trend';d.innerHTML=`<div class="trendhead"><span>${x[0]}</span><span>${money(x[1])}</span></div><div class="barbg"><div class="bar" style="width:${x[1]/max*100}%"></div></div>`;t.appendChild(d)})}}function renderTasks(){const box=$('#tasks');box.innerHTML='';[...tasks].sort((a,b)=>a.done-b.done||a.date.localeCompare(b.date)).forEach(t=>{const r=document.createElement('div');r.className='taskrow';const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.onchange=()=>{t.done=cb.checked;save();renderAll()};const txt=document.createElement('div');txt.style.flex='1';txt.innerHTML='<div></div><div class="sub"></div>';txt.children[0].textContent=t.text;if(t.done)txt.children[0].className='done';txt.children[1].textContent=t.date;const del=document.createElement('button');del.textContent='删除';del.className='btn';del.style.background='#ffeceb';del.style.color='#ff3b30';del.onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save();renderAll()};r.append(cb,txt,del);box.appendChild(r)});if(!box.children.length)box.innerHTML='<div class="row muted">还没有备忘事项</div>'}function renderCal(){$('#calTitle').textContent=`${cy}年${cm+1}月`;const box=$('#cal');box.innerHTML='';const first=new Date(Date.UTC(cy,cm,1)).getUTCDay(),days=new Date(Date.UTC(cy,cm+1,0)).getUTCDate();for(let i=0;i<first;i++)box.appendChild(document.createElement('span'));for(let d=1;d<=days;d++){const date=`${cy}-${pad(cm+1)}-${pad(d)}`;const b=document.createElement('button');b.className='day'+(date===selected?' sel':'')+(tasks.some(t=>t.date===date&&!t.done)?' task':'');b.textContent=d;b.onclick=()=>{selected=date;renderCal()};box.appendChild(b)}$('#selectedLabel').textContent=selected;const dst=$('#selectedTasks');dst.innerHTML='';const ts=tasks.filter(t=>t.date===selected);ts.forEach(t=>{const d=document.createElement('div');d.textContent=(t.done?'✓ ':'• ')+t.text;dst.appendChild(d)});if(!ts.length)dst.innerHTML='<span class="muted">这一天暂无事项</span>'}function renderAll(){renderHome();renderStats();renderTasks();renderCal()}$$('.nav button').forEach(b=>b.onclick=()=>{$$('.page').forEach(p=>p.classList.remove('active'));$$('.nav button').forEach(x=>x.classList.remove('active'));$('#'+b.dataset.page).classList.add('active');b.classList.add('active')});$('#goStats').onclick=()=>document.querySelector('[data-page="stats"]').click();$('#goMemo').onclick=()=>document.querySelector('[data-page="memo"]').click();$$('.seg button').forEach(b=>b.onclick=()=>{$$('.seg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;renderStats()});$('#openEntry').onclick=()=>$('#entryDialog').showModal();$('#closeEntry').onclick=()=>$('#entryDialog').close();$('#saveEntry').onclick=()=>{const name=$('#entryName').value.trim(),amount=Number($('#entryAmount').value),cny=Number($('#entryCny').value);if(!name||amount<=0||cny<=0)return alert('请填写名称、原币金额和折算人民币金额');entries.push({id:Date.now(),type:$('#entryType').value,name,amount,currency:$('#entryCurrency').value,cny,category:$('#entryCategory').value,date:$('#entryDate').value||today});save();$('#entryDialog').close();$('#entryName').value='';$('#entryAmount').value='';$('#entryCny').value='';renderAll()};$('#addTask').onclick=()=>{const text=$('#taskText').value.trim(),date=$('#taskDate').value;if(!text||!date)return alert('请填写事项和日期');tasks.push({id:Date.now(),text,date,done:false});$('#taskText').value='';save();renderAll()};$('#addFromCal').onclick=()=>{$('#taskDate').value=selected;document.querySelector('[data-page="memo"]').click();$('#taskText').focus()};$('#prev').onclick=()=>{cm--;if(cm<0){cm=11;cy--}renderCal()};$('#next').onclick=()=>{cm++;if(cm>11){cm=0;cy++}renderCal()};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});renderAll();
</script></body></html>
