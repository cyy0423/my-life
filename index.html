<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7">
<link rel="manifest" href="manifest.webmanifest">
<title>我的生活</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f5f5f7;color:#111;padding:18px 16px 105px;max-width:650px;margin:auto}
h1{font-size:32px;margin:8px 0 2px}.muted{color:#888;font-size:14px}.page{display:none}.page.active{display:block}.card{background:#fff;border-radius:20px;padding:17px;margin:13px 0;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #eee}.row:last-child{border:0}
.task{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.task input{width:22px;height:22px}.done .txt{text-decoration:line-through;color:#aaa}
.add{display:flex;gap:8px;margin-top:12px}.add input,.form input,.form select{width:100%;border:0;background:#f2f2f7;border-radius:12px;padding:12px;font-size:16px}
button{font:inherit;cursor:pointer}.primary{border:0;background:#111;color:#fff;border-radius:12px;padding:12px 15px;font-weight:700}.delete{border:0;background:none;color:#aaa;font-size:20px}
.nav{position:fixed;z-index:50;left:0;right:0;bottom:0;display:flex;background:rgba(255,255,255,.96);border-top:1px solid #ddd;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:0;background:transparent;padding:8px;color:#777}.nav button.active{color:#111;font-weight:800}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.billbox{background:#f5f5f7;border-radius:15px;padding:13px 7px;text-align:center}.money{font-weight:800;margin-top:5px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin:12px 0}.calhead button{border:0;background:#f2f2f7;border-radius:10px;padding:7px 13px;font-size:20px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;color:#999;font-size:12px;padding:4px}.day{min-height:45px;border:0;background:#f5f5f7;border-radius:11px;position:relative}.day.selected{background:#111;color:#fff}.day.today{outline:2px solid #111}.day.selected.today{outline:none}.dot{width:5px;height:5px;border-radius:50%;background:currentColor;position:absolute;bottom:5px;left:50%;transform:translateX(-50%)}
.form{display:grid;gap:9px}.empty{text-align:center;color:#aaa;padding:18px 0}.sectiontitle{font-weight:800;font-size:18px}.monthitem .date{min-width:45px;font-weight:800}
</style>
</head>
<body>
<h1>我的生活</h1><div id="topDate" class="muted"></div>

<main id="todayPage" class="page active">
 <div class="card"><div class="muted">今天</div><div id="todayProgress" style="font-size:27px;font-weight:800;margin-top:3px">0 项任务</div></div>
 <div class="card"><div class="sectiontitle">今日任务</div><div id="todayTasks"></div>
   <div class="add"><input id="todayInput" placeholder="添加今天的任务"><button id="addToday" class="primary">添加</button></div>
 </div>
 <div class="card"><div class="row"><div class="sectiontitle">本月任务</div><span id="monthProgress" class="muted"></span></div><div id="monthTasks"></div></div>
 <div class="card"><div class="sectiontitle">本月生活账单</div><div class="grid3">
   <div class="billbox">⚡<div class="muted">电费</div><div id="elec" class="money">—</div></div>
   <div class="billbox">🔥<div class="muted">燃气费</div><div id="gas" class="money">—</div></div>
   <div class="billbox">🌐<div class="muted">网费</div><div id="net" class="money">—</div></div>
 </div><div class="row"><b>合计</b><b id="billTotal">0원</b></div></div>
</main>

<main id="calendarPage" class="page">
 <div class="card"><div class="sectiontitle">任务日历</div>
   <div class="calhead"><button id="prevMonth">‹</button><b id="calTitle"></b><button id="nextMonth">›</button></div>
   <div id="calendar" class="calendar"></div>
   <div id="selectedTitle" style="font-size:20px;font-weight:800;margin-top:18px"></div>
   <div id="selectedTasks"></div>
   <div class="add"><input id="datedInput" placeholder="给这一天添加任务"><button id="addDated" class="primary">添加</button></div>
 </div>
</main>

<main id="billsPage" class="page">
 <div class="card"><div class="sectiontitle">添加账单</div><div class="form" style="margin-top:12px">
   <input id="billMonth" type="month"><select id="billType"><option>电费</option><option>燃气费</option><option>网费</option></select>
   <input id="billAmount" type="number" inputmode="numeric" placeholder="金额（韩元）"><input id="billNote" placeholder="备注（可选）">
   <button id="saveBill" class="primary">保存账单</button>
 </div></div>
 <div class="card"><div class="sectiontitle">账单记录</div><div id="billHistory"></div></div>
</main>

<nav class="nav">
 <button data-page="todayPage" class="active">✓<br>今天</button>
 <button data-page="calendarPage">▦<br>日历</button>
 <button data-page="billsPage">₩<br>账单</button>
</nav>

<script>
(function(){
 function $(id){return document.getElementById(id)}
 function pad(n){return String(n).padStart(2,'0')}
 function iso(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
 function ym(d){return iso(d).slice(0,7)}
 function esc(s){var e=document.createElement("div");e.textContent=s;return e.innerHTML}
 var TODAY=iso(), selected=TODAY, view=TODAY.slice(0,7);
 var tasks=[], bills=[];
 try{tasks=JSON.parse(localStorage.getItem("mylife_tasks")||"[]")}catch(e){}
 try{bills=JSON.parse(localStorage.getItem("mylife_bills")||"[]")}catch(e){}
 if(!localStorage.getItem("mylife_seeded")){
   bills.push({id:1,month:"2026-09",type:"电费",amount:37990,note:"238kWh；使用期 7/27–9/11"});
   localStorage.setItem("mylife_seeded","1"); persist();
 }
 $("topDate").textContent=new Intl.DateTimeFormat("zh-CN",{month:"long",day:"numeric",weekday:"long"}).format(new Date());
 $("billMonth").value=TODAY.slice(0,7);

 function persist(){localStorage.setItem("mylife_tasks",JSON.stringify(tasks));localStorage.setItem("mylife_bills",JSON.stringify(bills));renderAll()}
 function taskNode(t){
   var d=document.createElement("div");d.className="task"+(t.done?" done":"");
   var c=document.createElement("input");c.type="checkbox";c.checked=!!t.done;c.addEventListener("change",function(){t.done=c.checked;persist()});
   var s=document.createElement("span");s.className="txt";s.style.flex="1";s.textContent=t.text;
   var x=document.createElement("button");x.className="delete";x.textContent="×";x.addEventListener("click",function(){tasks=tasks.filter(function(q){return q.id!==t.id});persist()});
   d.append(c,s,x);return d
 }
 function fillTasks(container,list){container.innerHTML="";if(!list.length){container.innerHTML='<div class="empty">没有任务</div>';return}list.forEach(function(t){container.appendChild(taskNode(t))})}
 function renderToday(){
   var a=tasks.filter(function(t){return t.date===TODAY}), done=a.filter(function(t){return t.done}).length;
   fillTasks($("todayTasks"),a);$("todayProgress").textContent=a.length?(done+"/"+a.length+" 已完成"):"0 项任务";
   var m=TODAY.slice(0,7), all=tasks.filter(function(t){return t.date.slice(0,7)===m}).sort(function(a,b){return a.date.localeCompare(b.date)});
   $("monthTasks").innerHTML="";
   if(!all.length)$("monthTasks").innerHTML='<div class="empty">本月还没有任务</div>';
   all.forEach(function(t){var r=document.createElement("div");r.className="row monthitem";var date=document.createElement("div");date.className="date";date.textContent=Number(t.date.slice(8))+"日";var wrap=document.createElement("div");wrap.style.flex="1";wrap.appendChild(taskNode(t));r.append(date,wrap);$("monthTasks").appendChild(r)});
   $("monthProgress").textContent=all.length?(all.filter(function(t){return t.done}).length+"/"+all.length+" 已完成"):"0 项";
 }
 function renderCalendar(){
   var p=view.split("-"), y=+p[0], m=+p[1], first=new Date(y,m-1,1), days=new Date(y,m,0).getDate();
   $("calTitle").textContent=y+"年"+m+"月";$("calendar").innerHTML="";
   ["日","一","二","三","四","五","六"].forEach(function(n){var z=document.createElement("div");z.className="dow";z.textContent=n;$("calendar").appendChild(z)});
   for(var b=0;b<first.getDay();b++){var blank=document.createElement("div");$("calendar").appendChild(blank)}
   for(let n=1;n<=days;n++){
     let ds=view+"-"+pad(n), btn=document.createElement("button");btn.className="day"+(ds===selected?" selected":"")+(ds===TODAY?" today":"");btn.textContent=n;
     if(tasks.some(function(t){return t.date===ds})){var dot=document.createElement("i");dot.className="dot";btn.appendChild(dot)}
     btn.addEventListener("click",function(){selected=ds;renderCalendar()});$("calendar").appendChild(btn)
   }
   var dt=new Date(selected+"T00:00:00");$("selectedTitle").textContent=new Intl.DateTimeFormat("zh-CN",{month:"long",day:"numeric",weekday:"long"}).format(dt);
   fillTasks($("selectedTasks"),tasks.filter(function(t){return t.date===selected}))
 }
 function renderBills(){
   var cur=bills.filter(function(b){return b.month===TODAY.slice(0,7)});
   function sum(type){return cur.filter(function(b){return b.type===type}).reduce(function(s,b){return s+Number(b.amount)},0)}
   var e=sum("电费"),g=sum("燃气费"),n=sum("网费");$("elec").textContent=e?e.toLocaleString()+"원":"—";$("gas").textContent=g?g.toLocaleString()+"원":"—";$("net").textContent=n?n.toLocaleString()+"원":"—";$("billTotal").textContent=(e+g+n).toLocaleString()+"원";
   $("billHistory").innerHTML="";bills.slice().sort(function(a,b){return b.month.localeCompare(a.month)}).forEach(function(b){
     var r=document.createElement("div");r.className="row";r.innerHTML="<div><b>"+esc(b.month+" · "+b.type)+"</b><div class='muted'>"+esc(b.note||"")+"</div></div><b>"+Number(b.amount).toLocaleString()+"원</b>";$("billHistory").appendChild(r)
   })
 }
 function renderAll(){renderToday();renderCalendar();renderBills()}
 document.querySelectorAll(".nav button").forEach(function(btn){btn.addEventListener("click",function(){
   document.querySelectorAll(".page").forEach(function(p){p.classList.remove("active")});document.querySelectorAll(".nav button").forEach(function(b){b.classList.remove("active")});
   $(btn.dataset.page).classList.add("active");btn.classList.add("active");if(btn.dataset.page==="calendarPage")renderCalendar()
 })});
 $("addToday").addEventListener("click",function(){var v=$("todayInput").value.trim();if(!v)return;tasks.push({id:Date.now(),date:TODAY,text:v,done:false});$("todayInput").value="";persist()});
 $("addDated").addEventListener("click",function(){var v=$("datedInput").value.trim();if(!v)return;tasks.push({id:Date.now(),date:selected,text:v,done:false});$("datedInput").value="";persist()});
 $("prevMonth").addEventListener("click",function(){moveMonth(-1)});$("nextMonth").addEventListener("click",function(){moveMonth(1)});
 function moveMonth(n){var p=view.split("-"),d=new Date(+p[0],+p[1]-1+n,1);view=d.getFullYear()+"-"+pad(d.getMonth()+1);selected=view+"-01";renderCalendar()}
 $("saveBill").addEventListener("click",function(){var a=Number($("billAmount").value);if(!$("billMonth").value||!a)return;bills.push({id:Date.now(),month:$("billMonth").value,type:$("billType").value,amount:a,note:$("billNote").value.trim()});$("billAmount").value="";$("billNote").value="";persist()});
 renderAll();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
</script>
</body></html>
